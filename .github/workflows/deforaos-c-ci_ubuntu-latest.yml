name: DeforaOS C CI (ubuntu-latest)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          docbook-xsl \
          gtk-doc-tools \
          libxml2-utils \
          xsltproc
    - name: make
      run: make
    - name: make tests
      run: make tests
    - name: make distcheck
      run: make distcheck
